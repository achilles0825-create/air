const AudioEngine = {
  ctx: null, enabled: true,
  init() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) this.ctx = new AC();
    }
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  },
  playTone(freq, type, duration, vol=0.1, slideTo=null) {
    if (!this.enabled || !this.ctx) return;
    try {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
      if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, this.ctx.currentTime + duration);
      gain.gain.setValueAtTime(vol, this.ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);
      osc.connect(gain); gain.connect(this.ctx.destination);
      osc.start(); osc.stop(this.ctx.currentTime + duration);
    } catch (e) {}
  },
  shoot() { this.playTone(600, 'square', 0.05, 0.03, 300); },
  hitEnemy() { this.playTone(300, 'triangle', 0.1, 0.05, 100); },
  playerHit() { this.playTone(150, 'sawtooth', 0.3, 0.1, 50); },
  pickup() { this.playTone(800, 'sine', 0.1, 0.1, 1200); },
  buy() { this.playTone(400, 'square', 0.1, 0.05, 600); },
  error() { this.playTone(150, 'sawtooth', 0.2, 0.1); },
  bomb() { this.playTone(100, 'sawtooth', 0.5, 0.2, 20); },
  shield() { this.playTone(300, 'sine', 0.4, 0.1, 600); },
  bossWarning() { this.playTone(400, 'square', 0.2, 0.1); setTimeout(() => this.playTone(400, 'square', 0.2, 0.1), 250); }
};

let saveTimeout = null;
function saveToCloud() {
  if (!saveData.playerName || isAdmin) return;
  clearTimeout(saveTimeout);
  saveTimeout = setTimeout(() => {
    set(ref(db, 'players/' + saveData.playerName), saveData)
      .catch(e => console.warn("雲端存檔失敗", e));
  }, 1000);
}

      saveData.playerName = '管理员';
      showMsg("管理员登录成功！", "#0f0");
      setTimeout(() => { state = 'menu'; isDataLoaded = true; }, 500);
    } else {
      showMsg("管理員密碼錯誤！", "#f44");
    }
    return;
  }

  isAdmin = false;
  
  try {
    const timeout = new Promise((_, reject) => setTimeout(() => reject(new Error("timeout")), 3000));
    const dbCall = get(child(ref(db), 'players/' + loginUser.trim()));
    const snapshot = await Promise.race([dbCall, timeout]);

    if (action === 'login') {
      if (snapshot.exists()) {
        const data = snapshot.val();
        if (data.password === loginPass) {
          saveData = { ...saveData, ...data };
          if (!saveData.unlockedShips) saveData.unlockedShips = ['blue', 'red'];
          showMsg("登入成功！", "#0f0");
          setTimeout(() => { state = 'menu'; isDataLoaded = true; }, 500);
        } else {
          showMsg("密碼錯誤！", "#f44");
        }
      } else {
        showMsg("帳號不存在！", "#f44");
      }
    } else if (action === 'register') {
      if (snapshot.exists()) {
        showMsg("帳號已存在！", "#f44");
      } else {
        saveData = {
          money: 0, upgradeFire: 0, upgradeHp: 0, upgradeSpeed: 0, upgradeSkill: 0,
          selectedShipId: 'blue', playerName: loginUser.trim(), maxScore: 0, maxStage: 0,
          unlockedShips: ['blue', 'red'], password: loginPass
        };
        await set(ref(db, 'players/' + loginUser.trim()), saveData);
        showMsg("註冊成功！自動登入", "#0f0");
        setTimeout(() => { state = 'menu'; isDataLoaded = true; }, 500);
      }
    }
  } catch (error) {
    console.warn("Firebase 連線失敗，進入離線模式");
    saveData.playerName = loginUser.trim();
    if (!saveData.unlockedShips) saveData.unlockedShips = ['blue', 'red'];
    showMsg("連線失敗，離線模式啟動", "#ff0");
    setTimeout(() => { state = 'menu'; isDataLoaded = true; }, 1000);
  }
}

function getPrice(base, lvl) { return base + lvl * (base * 0.5); }

const player = {
  x: W/2, y: H-140, w: 36, h: 36, speed: 5, hp: 100, maxHp: 100,
  fireTimer: 0, invuln: 0, bombCD: 0, bombMaxCD: 300, shieldCD: 0, shieldMaxCD: 450,
  color: '#4cf', fireLevel: 0, sprite: null
};

let bullets = [], enemies = [], ebullets = [], popups = [], pickups = [];
let score = 0, money = 0, allClear = false, stage = 1, sub = 1, log = [], stageBanner = 0, screenShake = 0, boss = null;

function addLog(msg) { log.push(msg); if (log.length > 5) log.shift(); }
function stageText() { return stage + '-' + sub; }
function stageDifficulty() { return (stage - 1) * MAX_SUB + sub; }

function enemyStats(diff) {
  return {
    hp: 1 + Math.floor(diff / 2), speed: 0.9 + diff * 0.15,
    shootInterval: Math.max(30, 150 - diff * 8), bulletSpeed: 0.06 + diff * 0.008,
    count: 1 + Math.floor(diff / 2), eliteChance: diff >= 6 ? Math.min(0.5, 0.1 + (diff - 6) * 0.05) : 0,
    fastChance: diff >= 2 ? Math.min(0.4, 0.15 + (diff - 2) * 0.03) : 0
  };
}

function resetGame() {
  const ship = SHIPS.find(s => s.id === saveData.selectedShipId) || SHIPS[0];
  player.x = W/2; player.y = H-140; player.color = ship.color; player.sprite = ship.sprite;
  player.maxHp = ship.baseHp + saveData.upgradeHp * 50;
  player.hp = player.maxHp;
  player.speed = ship.baseSpeed + saveData.upgradeSpeed * 1;
  player.fireLevel = ship.baseFire + saveData.upgradeFire;
  
  const cdReduce = Math.max(0.2, 1 - saveData.upgradeSkill * 0.1);
  player.bombMaxCD = Math.floor(300 * cdReduce);
  player.shieldMaxCD = Math.floor(450 * cdReduce);
  player.fireTimer = 0; player.invuln = 0; player.bombCD = 0; player.shieldCD = 0;
  
  bullets = []; enemies = []; ebullets = []; popups = []; pickups = []; log = [];
  score = 0; money = 0; allClear = false; stage = 1; sub = 1; stageBanner = 0; screenShake = 0; boss = null;
}

function startGame() {
  AudioEngine.init(); resetGame(); state = 'playing'; spawnStage();
}

function spawnStage() {
  enemies = []; ebullets = []; popups = []; pickups = []; boss = null;
  const diff = stageDifficulty();
  if (sub === 3) {
    boss = { x: W/2 - 120, y: -150, w: 240, h: 150, hp: 50 + diff * 20, maxHp: 50 + diff * 20, vx: 2 + diff * 0.2, shootTimer: 60, entering: true };
    addLog('⚠️ BOSS 来袭！'); AudioEngine.bossWarning(); stageBanner = 120;
  } else {
    const st = enemyStats(diff);
    for (let i = 0; i < st.count; i++) {
      const isElite = Math.random() < st.eliteChance;
      const isFast = !isElite && Math.random() < st.fastChance;
      const size = isElite ? 78 : (isFast ? 32 : 54);
      const hp = isElite ? Math.ceil(st.hp * 2.5) : (isFast ? 1 : st.hp);
      enemies.push({
        x: 60 + (i % 4) * (W - 120) / 3, y: 200 + Math.floor(i / 4) * 120 + Math.random() * 60,
        w: size, h: size, hp: hp, maxHp: hp, elite: isElite, fast: isFast,
        vx: (Math.random() < 0.5 ? -1 : 1) * st.speed * (isFast ? 2 : 1), vy: (0.4 + Math.random() * 0.5) * (isElite ? 0.7 : (isFast ? 1.8 : 1)),
        shootTimer: 50 + Math.random() * st.shootInterval, shootInterval: isElite ? Math.max(25, st.shootInterval * 0.7) : (isFast ? Math.max(20, st.shootInterval * 0.45) : st.shootInterval), bulletSpeed: st.bulletSpeed,
        zigzagPhase: Math.random() * Math.PI * 2
      });
    }
    stageBanner = 90; addLog('关卡 ' + stageText() + ' 开始！');
  }
}

function nextStage() {
  sub++;
  if (sub > MAX_SUB) { sub = 1; stage++; }
  if (stage > MAX_STAGE) {
    allClear = true; state = 'gameover'; addLog('全部通关！');
    saveData.money += money;
    if (score > saveData.maxScore) saveData.maxScore = score;
    if (stage > saveData.maxStage) saveData.maxStage = stage;
    saveToCloud();
    return;
  }
  spawnStage();
}

function autoFire() {
  AudioEngine.shoot();
  const cx = player.x + player.w/2 - 4, cy = player.y, fLvl = player.fireLevel;
  if (fLvl === 0) bullets.push({ x: cx, y: cy, w: 8, h: 16, vx: 0, vy: -14, life: 100 });
  else if (fLvl === 1) {
    bullets.push({ x: cx - 10, y: cy + 10, w: 8, h: 16, vx: -1.5, vy: -14, life: 100 });
    bullets.push({ x: cx + 10, y: cy + 10, w: 8, h: 16, vx: 1.5, vy: -14, life: 100 });
  } else if (fLvl === 2) {
    bullets.push({ x: cx, y: cy, w: 8, h: 16, vx: 0, vy: -14, life: 100 });
    bullets.push({ x: cx - 14, y: cy + 14, w: 8, h: 16, vx: -3, vy: -13.5, life: 100 });
    bullets.push({ x: cx + 14, y: cy + 14, w: 8, h: 16, vx: 3, vy: -13.5, life: 100 });
  } else {
    bullets.push({ x: cx, y: cy, w: 8, h: 16, vx: 0, vy: -15, life: 100 });
    bullets.push({ x: cx - 12, y: cy + 10, w: 8, h: 16, vx: -3, vy: -14, life: 100 });
    bullets.push({ x: cx + 12, y: cy + 10, w: 8, h: 16, vx: 3, vy: -14, life: 100 });
    bullets.push({ x: cx - 24, y: cy + 20, w: 8, h: 16, vx: -6, vy: -13, life: 100 });
    bullets.push({ x: cx + 24, y: cy + 20, w: 8, h: 16, vx: 6, vy: -13, life: 100 });
    if (fLvl >= 5) bullets.push({ x: cx, y: cy + 20, w: 8, h: 16, vx: 0, vy: -14, life: 100 });
  }
}

function enemyShoot(e) {
  const shots = e.elite ? 3 : 1;
  for (let s = 0; s < shots; s++) {
    const spread = e.elite ? (s - 1) * 90 : 0;
    const tx = player.x + player.w/2 + spread, ty = player.y + player.h/2;
    const sx = e.x + e.w/2 - 6, sy = e.y + e.h;
    const dx = tx - sx, dy = ty - sy;
    const len = Math.hypot(dx, dy) || 1, speed = e.elite ? 5.5 : (e.fast ? 6.5 : 4.5);
    const size = e.fast ? 8 : 12;
    ebullets.push({ x: sx, y: sy, w: size, h: size, vx: (dx / len) * speed, vy: (dy / len) * speed, bounces: 0, life: 300, damage: e.elite ? 15 : (e.fast ? 4 : 8), hitCooldown: 0 });
  }
}

function bossShoot(b) {
  const diff = stageDifficulty(), shots = 5 + Math.floor(diff / 3);
  for (let s = 0; s < shots; s++) {
    const angle = Math.PI/2 + (s - (shots-1)/2) * 0.25, speed = 5 + diff * 0.2;
    ebullets.push({ x: b.x + b.w/2 - 10, y: b.y + b.h - 20, w: 20, h: 20, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, bounces: 0, life: 300, damage: 15, hitCooldown: 0 });
  }
}

function dropHealBlock(x, y, isBig) {
  pickups.push({ x: x, y: y, w: isBig ? 30 : 20, h: isBig ? 30 : 20, vx: (Math.random() - 0.5) * 3, vy: 1 + Math.random(), amount: isBig ? 30 : 15, isBig: isBig, life: 300, phase: Math.random() * Math.PI * 2 });
}

function gainDarkMatter(x, y, elite, isBoss = false) {
  let amount = isBoss ? 30 + Math.floor(stageDifficulty() * 5) : (elite ? 5 + Math.floor(Math.random() * 4) : 1 + Math.floor(Math.random() * 2));
  money += amount; saveData.money += amount; saveToCloud();
  popups.push({ x: x, y: y, text: '+' + amount + ' 暗物质', life: 80, maxLife: 80, color: isBoss ? '#f4f' : (elite ? '#e0b0ff' : '#b388ff'), size: isBoss ? 40 : (elite ? 30 : 24), vy: -1.5 });
  addLog('+' + amount + ' 暗物质');
}

function useBomb() {
  if (player.bombCD > 0) return;
  AudioEngine.bomb(); player.bombCD = player.bombMaxCD; ebullets = []; screenShake = 15; addLog('💥 全屏轰炸！');
  for (let j = enemies.length - 1; j >= 0; j--) {
    const e = enemies[j]; e.hp -= 5;
    if (e.hp <= 0) { gainDarkMatter(e.x + e.w/2, e.y + e.h/2, e.elite); score += (e.elite ? 50 : (e.fast ? 6 : 10)) * stageDifficulty(); enemies.splice(j, 1); }
  }
  if (boss) {
    boss.hp -= 20;
    if (boss.hp <= 0) {
      gainDarkMatter(boss.x + boss.w/2, boss.y + boss.h/2, false, true);
      score += 500 * stageDifficulty();
      for(let i=0; i<3; i++) dropHealBlock(boss.x + boss.w/2, boss.y + boss.h/2, true);
      boss = null; nextStage();
    }
  }
}

function useShield() {
  if (player.shieldCD > 0) return;
  AudioEngine.shield(); player.shieldCD = player.shieldMaxCD; player.invuln = Math.max(player.invuln, 180); addLog('🛡️ 能量护盾开启！');
}

function update() {
  if (state === 'login' || state === 'menu' || state === 'shop' || state === 'shipSelect' || state === 'admin') return;
  if (state === 'gameover') {
    popups.forEach(p => { p.y += p.vy; p.vy *= 0.97; p.life--; });
    popups = popups.filter(p => p.life > 0);
    return;
  }

  if (stageBanner > 0) stageBanner--;
  if (player.invuln > 0) player.invuln--;
  if (player.bombCD > 0) player.bombCD--;
  if (player.shieldCD > 0) player.shieldCD--;
  if (screenShake > 0) screenShake--;

  if (keys['ArrowLeft'] || keys['a']) player.x -= player.speed;
  if (keys['ArrowRight'] || keys['d']) player.x += player.speed;
  if (keys['ArrowUp'] || keys['w']) player.y -= player.speed;
  if (keys['ArrowDown'] || keys['s']) player.y += player.speed;
  player.x = Math.max(0, Math.min(W - player.w, player.x));
  player.y = Math.max(140, Math.min(H - player.h, player.y));

  player.fireTimer--;
  if (player.fireTimer <= 0) { autoFire(); player.fireTimer = FIRE_INTERVAL; }

  enemies.forEach(e => {
    e.x += e.vx; e.y += e.vy;
    if (e.fast) { e.zigzagPhase += 0.15; e.x += Math.sin(e.zigzagPhase) * 2.2; }
    if (e.x <= 0 || e.x + e.w >= W) { e.vx *= -1; e.x = Math.max(0, Math.min(W - e.w, e.x)); }
    if (e.y <= 140 || e.y + e.h >= H - 260) { e.vy *= -1; e.y = Math.max(140, Math.min(H - 260 - e.h, e.y)); }
    e.shootTimer--;
    if (e.shootTimer <= 0 && e.y > 0) { enemyShoot(e); e.shootTimer = e.shootInterval; }
  });

  if (boss) {
    if (boss.entering) { boss.y += 2; if (boss.y >= 150) boss.entering = false; }
    else {
      boss.x += boss.vx;
      if (boss.x <= 0 || boss.x + boss.w >= W) { boss.vx *= -1; boss.x = Math.max(0, Math.min(W - boss.w, boss.x)); }
      boss.shootTimer--;
      if (boss.shootTimer <= 0) { bossShoot(boss); boss.shootTimer = Math.max(30, 100 - stageDifficulty() * 5); }
    }
  }

  bullets.forEach(b => {
    b.x += b.vx; b.y += b.vy; b.life--;
    for (let j = enemies.length - 1; j >= 0; j--) {
      const e = enemies[j];
      if (b.x < e.x + e.w && b.x + b.w > e.x && b.y < e.y + e.h && b.y + b.h > e.y) {
        e.hp -= 1; b.life = 0;
        if (e.hp <= 0) {
          AudioEngine.hitEnemy(); gainDarkMatter(e.x + e.w/2, e.y + e.h/2, e.elite); score += (e.elite ? 50 : (e.fast ? 6 : 10)) * stageDifficulty();
          if (e.elite && Math.random() < 0.4) dropHealBlock(e.x + e.w/2, e.y + e.h/2, false);
          else if (!e.elite && Math.random() < 0.15) dropHealBlock(e.x + e.w/2, e.y + e.h/2, false);
          enemies.splice(j, 1);
        }
        return;
      }
    }
    if (boss && !boss.entering) {
      if (b.x < boss.x + boss.w && b.x + b.w > boss.x && b.y < boss.y + boss.h && b.y + b.h > boss.y) {
        boss.hp -= 1; b.life = 0;
        if (boss.hp <= 0) {
          AudioEngine.hitEnemy(); gainDarkMatter(boss.x + boss.w/2, boss.y + boss.h/2, false, true); score += 500 * stageDifficulty();
          for(let i=0; i<3; i++) dropHealBlock(boss.x + boss.w/2, boss.y + boss.h/2, true);
          boss = null; nextStage();
        }
      }
    }
  });
  bullets = bullets.filter(b => b.life > 0 && b.y + b.h > 0);

  pickups.forEach(p => {
    p.x += p.vx; p.y += p.vy; p.vy += 0.02; p.life--; p.phase += 0.1;
    if (p.x < 0 || p.x + p.w > W) p.vx *= -1;
    const dx = (player.x + player.w/2) - (p.x + p.w/2), dy = (player.y + player.h/2) - (p.y + p.h/2), dist = Math.hypot(dx, dy);
    if (dist < 150) { p.vx += (dx / dist) * 1.5; p.vy += (dy / dist) * 1.5; p.vx *= 0.9; p.vy *= 0.9; }
    if (dist < 35) {
      AudioEngine.pickup(); player.hp = Math.min(player.maxHp, player.hp + p.amount);
      popups.push({ x: player.x + player.w/2, y: player.y - 20, text: '+' + p.amount + '% HP', life: 60, maxLife: 60, color: '#0f0', size: 28, vy: -1.5 });
      p.life = 0;
    }
  });
  pickups = pickups.filter(p => p.life > 0);
  popups.forEach(p => { p.y += p.vy; p.vy *= 0.97; p.life--; });
  popups = popups.filter(p => p.life > 0);

  ebullets.forEach(b => {
    b.x += b.vx; b.y += b.vy; b.life--;
    if (b.hitCooldown > 0) b.hitCooldown--;
    if (b.x <= 0) { b.x = 0; b.vx = Math.abs(b.vx); b.bounces++; }
    else if (b.x + b.w >= W) { b.x = W - b.w; b.vx = -Math.abs(b.vx); b.bounces++; }
    if (b.y <= 0) { b.y = 0; b.vy = Math.abs(b.vy); b.bounces++; }
    else if (b.y + b.h >= H) { b.y = H - b.h; b.vy = -Math.abs(b.vy); b.bounces++; }
    if (b.hitCooldown <= 0 && player.invuln <= 0) {
      const dx = (b.x + b.w/2) - (player.x + player.w/2), dy = (b.y + b.h/2) - (player.y + player.h/2);
      if (Math.abs(dx) < player.w/2 + 6 && Math.abs(dy) < player.h/2 + 6) {
        AudioEngine.playerHit(); player.hp = Math.max(0, player.hp - b.damage); player.invuln = 10;
        addLog('你被击中！HP -' + b.damage + '%');
        const len = Math.hypot(dx, dy) || 1, speed = Math.hypot(b.vx, b.vy) || 5;
        b.vx = (dx / len) * speed; b.vy = (dy / len) * speed;
        if (Math.abs(b.vy) < 2) b.vy = (dy >= 0 ? 3 : -3);
        b.bounces++; b.hitCooldown = 10;
      }
    }
  });
  ebullets = ebullets.filter(b => b.bounces < MAX_EB && b.life > 0);

  if (player.hp <= 0) {
    state = 'gameover'; addLog('游戏结束…');
    if (score > saveData.maxScore) saveData.maxScore = score;
    if (stage > saveData.maxStage) saveData.maxStage = stage;
    saveToCloud();
    return;
  }
  if (!boss && enemies.length === 0) nextStage();
}

function drawStars() {
  ctx.fillStyle = '#fff';
  for (let i = 0; i < 70; i++) {
    const x = (i * 137) % W, y = (i * 83 + (performance.now() * 0.04) % H) % H;
    ctx.fillRect(x, y, 3, 3);
  }
}

function drawBoss(b) {
  const sprite = ENEMY_SPRITES.boss;
  if (sprite && sprite.complete && sprite.naturalWidth > 0) {
    const pulse = Math.sin(performance.now() * 0.004) * 4;
    const scale = Math.min(b.w / sprite.naturalWidth, b.h / sprite.naturalHeight);
    const dw = sprite.naturalWidth * scale + pulse, dh = sprite.naturalHeight * scale + pulse;
    ctx.save();
    ctx.shadowColor = 'rgba(60,255,140,0.6)'; ctx.shadowBlur = 20;
    ctx.drawImage(sprite, b.x + b.w/2 - dw/2, b.y + b.h/2 - dh/2, dw, dh);
    ctx.restore();
  } else {
    ctx.fillStyle = '#222'; ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.strokeStyle = '#f00'; ctx.lineWidth = 4; ctx.strokeRect(b.x, b.y, b.w, b.h);
    const bs = 30, pulse = Math.sin(performance.now() * 0.005) * 5;
    ctx.fillStyle = '#f44'; ctx.fillRect(b.x + 20, b.y + 40, bs, bs); ctx.fillRect(b.x + 20, b.y + 80, bs, bs); ctx.fillRect(b.x + 60, b.y + 60, bs, bs);
    ctx.fillRect(b.x + b.w - 50, b.y + 40, bs, bs); ctx.fillRect(b.x + b.w - 50, b.y + 80, bs, bs); ctx.fillRect(b.x + b.w - 90, b.y + 60, bs, bs);
    ctx.fillStyle = '#888'; ctx.fillRect(b.x + 80, b.y + 10, bs, bs); ctx.fillRect(b.x + 130, b.y + 10, bs, bs);
    const cx = b.x + b.w / 2 - (bs + pulse) / 2, cy = b.y + b.h / 2 - (bs + pulse) / 2, coreSize = bs + pulse;
    ctx.fillStyle = '#ff0'; ctx.fillRect(cx, cy, coreSize, coreSize); ctx.fillStyle = '#fff'; ctx.fillRect(cx + 5, cy + 5, coreSize - 10, coreSize - 10);
    ctx.fillStyle = '#555'; ctx.fillRect(b.x + 40, b.y + b.h - 10, 20, 20); ctx.fillRect(b.x + b.w - 60, b.y + b.h - 10, 20, 20);
  }
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  if (state === 'login') { drawLogin(); return; }
  if (state === 'menu') { drawMenu(); if (showDeleteConfirm) drawDeleteConfirm(); return; }
  if (state === 'admin') { drawAdmin(); if (showDeleteConfirm) drawDeleteConfirm(); return; }
  if (state === 'shipSelect') { drawShipSelect(); return; }
  if (state === 'shop') { drawShop(); return; }

  ctx.save();
  if (screenShake > 0) ctx.translate((Math.random() - 0.5) * screenShake, (Math.random() - 0.5) * screenShake);
  drawStars();

  if (player.invuln > 0) {
    ctx.fillStyle = 'rgba(76, 204, 255, 0.3)'; ctx.beginPath(); ctx.arc(player.x + player.w/2, player.y + player.h/2, 35 + Math.sin(performance.now()*0.01)*5, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = player.color; ctx.lineWidth = 2; ctx.stroke();
  }
  if (player.sprite && player.sprite.complete && player.sprite.naturalWidth > 0) {
    const ph = 58, pw = ph * (player.sprite.naturalWidth / player.sprite.naturalHeight);
    ctx.drawImage(player.sprite, player.x + player.w/2 - pw/2, player.y + player.h/2 - ph/2, pw, ph);
  } else {
    ctx.fillStyle = player.color; ctx.beginPath(); ctx.moveTo(player.x + player.w/2, player.y); ctx.lineTo(player.x, player.y + player.h); ctx.lineTo(player.x + player.w, player.y + player.h); ctx.closePath(); ctx.fill();
  }

  const hpPct = Math.ceil(player.hp / player.maxHp * 100), barW = 28, barH = 4, barX = player.x + (player.w - barW) / 2, barY = player.y - 8;
  ctx.fillStyle = '#333'; ctx.fillRect(barX, barY, barW, barH);
  ctx.fillStyle = hpPct > 60 ? '#0f0' : hpPct > 30 ? '#ff0' : '#f44'; ctx.fillRect(barX, barY, barW * (player.hp / player.maxHp), barH);

  pickups.forEach(p => {
    const pulse = Math.sin(p.phase) * 3;
    ctx.fillStyle = '#0f0'; ctx.fillRect(p.x - pulse/2, p.y - pulse/2, p.w + pulse, p.h + pulse);
    ctx.fillStyle = '#fff'; ctx.fillRect(p.x + 4, p.y + 4, p.w - 8, p.h - 8);
    ctx.fillStyle = '#0f0'; ctx.fillRect(p.x + p.w/2 - 2, p.y + 4, 4, p.h - 8); ctx.fillRect(p.x + 4, p.y + p.h/2 - 2, p.w - 8, 4);
  });

  ctx.fillStyle = '#ff0'; bullets.forEach(b => ctx.fillRect(b.x, b.y, b.w, b.h));

  enemies.forEach(e => {
    const sprite = e.elite ? ENEMY_SPRITES.elite : (e.fast ? ENEMY_SPRITES.fast : ENEMY_SPRITES.normal);
    if (sprite && sprite.complete && sprite.naturalWidth > 0) {
      const bank = Math.max(-0.35, Math.min(0.35, e.vx * 0.07));
      ctx.save();
      ctx.translate(e.x + e.w/2, e.y + e.h/2);
      ctx.rotate(bank);
      const sc = Math.min(e.w / sprite.naturalWidth, e.h / sprite.naturalHeight), dw = sprite.naturalWidth * sc, dh = sprite.naturalHeight * sc;
      ctx.drawImage(sprite, -dw/2, -dh/2, dw, dh);
      ctx.restore();
      if (e.elite) { ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 2; ctx.strokeRect(e.x - 4, e.y - 4, e.w + 8, e.h + 8); }
    } else if (e.fast) {
      ctx.save();
      ctx.translate(e.x + e.w/2, e.y + e.h/2);
      ctx.rotate(Math.PI / 4);
      ctx.fillStyle = '#f4a'; ctx.fillRect(-e.w/2, -e.h/2, e.w, e.h);
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.strokeRect(-e.w/2, -e.h/2, e.w, e.h);
      ctx.restore();
    } else {
      ctx.fillStyle = e.elite ? '#c4f' : '#f44'; ctx.fillRect(e.x, e.y, e.w, e.h);
      if (e.elite) { ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.strokeRect(e.x - 3, e.y - 3, e.w + 6, e.h + 6); }
    }
    ctx.fillStyle = '#600'; ctx.fillRect(e.x, e.y - 12, e.w, 6);
    ctx.fillStyle = '#0f0'; ctx.fillRect(e.x, e.y - 12, e.w * (e.hp / e.maxHp), 6);
  });

  if (boss) {
    drawBoss(boss);
    if (!boss.entering) {
      ctx.fillStyle = 'rgba(0,0,0,0.8)'; ctx.fillRect(W/2 - 250, 120, 500, 20);
      ctx.fillStyle = '#f00'; ctx.fillRect(W/2 - 248, 122, 496 * (boss.hp / boss.maxHp), 16);
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.strokeRect(W/2 - 250, 120, 500, 20);
      ctx.fillStyle = '#fff'; ctx.font = 'bold 24px monospace'; ctx.textAlign = 'center'; ctx.fillText('⚠️ BOSS ⚠️', W/2, 112); ctx.textAlign = 'left';
    }
  }

  ebullets.forEach(b => { 
    // 因為 MAX_EB 改成 2，所以只會出現 0 次(橙) 和 1 次(黃)，第 2 次就爆了
    ctx.fillStyle = b.bounces === 0 ? '#f80' : '#ff0'; 
    ctx.beginPath(); ctx.arc(b.x + b.w/2, b.y + b.h/2, b.w/2, 0, Math.PI*2); ctx.fill(); 
  });
  popups.forEach(p => { ctx.globalAlpha = Math.min(1, p.life / (p.maxLife * 0.5)); ctx.fillStyle = p.color; ctx.font = 'bold ' + p.size + 'px monospace'; ctx.textAlign = 'center'; ctx.fillText(p.text, p.x, p.y); ctx.globalAlpha = 1; });

  ctx.fillStyle = 'rgba(0, 0, 0, 0.6)'; ctx.fillRect(0, 0, W, 110);
  ctx.textAlign = 'center'; ctx.fillStyle = '#fff'; ctx.font = 'bold 32px monospace'; ctx.fillText('Score: ' + score, W/2, 45);
  ctx.fillStyle = '#b388ff'; ctx.font = 'bold 28px monospace'; ctx.fillText('局内暗物质: ' + money, W/2, 85);

  ctx.textAlign = 'left'; ctx.fillStyle = '#fff'; ctx.font = 'bold 24px monospace'; ctx.fillText('HP: ' + hpPct + '%', 20, 40);
  ctx.fillStyle = '#ff0'; ctx.font = 'bold 28px monospace'; ctx.fillText('关卡: ' + stageText(), 20, 80);
  ctx.textAlign = 'right'; ctx.fillStyle = '#aaa'; ctx.font = '24px monospace'; ctx.fillText('敌机: ' + enemies.length, W - 20, 40); ctx.fillText('强度: ' + stageDifficulty(), W - 20, 80); ctx.textAlign = 'left';

  const drawSkillIcon = (x, y, key, cd, maxCd, color, name) => {
    ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(x, y, 70, 70);
    ctx.strokeStyle = cd > 0 ? '#666' : color; ctx.lineWidth = 3; ctx.strokeRect(x, y, 70, 70);
    ctx.textAlign = 'center'; ctx.fillStyle = cd > 0 ? '#666' : color; ctx.font = 'bold 26px monospace'; ctx.fillText(name, x + 35, y + 40);
    if (cd > 0) {
      const ratio = cd / maxCd;
      ctx.fillStyle = 'rgba(0,0,0,0.8)'; ctx.fillRect(x, y + 70 - (70 * ratio), 70, 70 * ratio);
      ctx.fillStyle = '#fff'; ctx.font = 'bold 24px monospace'; ctx.fillText(Math.ceil(cd / 60) + 's', x + 35, y + 42);
    } else { ctx.fillStyle = '#fff'; ctx.font = 'bold 18px monospace'; ctx.fillText('[' + key + ']', x + 35, y + 62); }
  };
  drawSkillIcon(20, H - 100, 'Q', player.bombCD, player.bombMaxCD, '#f44', '轰炸');
  drawSkillIcon(100, H - 100, 'E', player.shieldCD, player.shieldMaxCD, '#4cf', '护盾');

  ctx.textAlign = 'left'; ctx.font = '22px monospace'; ctx.fillStyle = 'rgba(255,255,255,0.6)';
  log.forEach((l, i) => ctx.fillText(l, 200, H - 120 + i * 24));

  if (stageBanner > 0) {
    ctx.globalAlpha = Math.min(1, stageBanner / 30); ctx.fillStyle = '#f00'; ctx.font = 'bold 72px monospace'; ctx.textAlign = 'center';
    ctx.fillText(boss ? '⚠️ BOSS 来袭 ⚠️' : 'STAGE ' + stageText(), W/2, H/2 - 60); ctx.globalAlpha = 1;
  }
  ctx.restore();

  ctx.fillStyle = AudioEngine.enabled ? '#0f0' : '#f44'; ctx.font = 'bold 36px monospace'; ctx.textAlign = 'right';
  ctx.fillText(AudioEngine.enabled ? '🔊' : '🔇', W - 30, 150); ctx.textAlign = 'left';

  if (state === 'gameover') {
    ctx.fillStyle = 'rgba(0,0,0,0.85)'; ctx.fillRect(0, 0, W, H); ctx.textAlign = 'center';
    ctx.fillStyle = '#fff'; ctx.font = '60px monospace'; ctx.fillText(allClear ? '全部通关！' : 'GAME OVER', W/2, H/2 - 100);
    ctx.font = '32px monospace'; ctx.fillText('Score: ' + score, W/2, H/2 - 30);
    ctx.fillStyle = '#b388ff'; ctx.fillText('本局获得暗物质: +' + money, W/2, H/2 + 20);
    const bx = W/2 - 180, by = H/2 + 120, bw = 360, bh = 80;
    ctx.fillStyle = 'rgba(76,204,255,0.15)'; ctx.fillRect(bx, by, bw, bh);
    ctx.strokeStyle = '#4cf'; ctx.lineWidth = 3; ctx.strokeRect(bx, by, bw, bh);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 32px monospace'; ctx.fillText('返回主菜单', W/2, by + 50);
    ctx.font = '22px monospace'; ctx.fillStyle = 'rgba(255,255,255,0.6)'; ctx.fillText('按 R 返回', W/2, by + 130);
  }
  ctx.textAlign = 'left';
}

canvas.addEventListener('mousedown', async (e) => {
  AudioEngine.init();
  const rect = canvas.getBoundingClientRect();
  const mx = (e.clientX - rect.left) * (W / rect.width);
  const my = (e.clientY - rect.top) * (H / rect.height);

  if (mx >= W - 80 && mx <= W - 10 && my >= 110 && my <= 170) {
    AudioEngine.enabled = !AudioEngine.enabled;
    if (AudioEngine.enabled) AudioEngine.buy();
    return;
  }

  if (showDeleteConfirm) {
    if (mx >= W/2 - 210 && mx <= W/2 - 10 && my >= H/2 + 70 && my <= H/2 + 130) {
      showDeleteConfirm = false; AudioEngine.buy();
    } 
    else if (mx >= W/2 + 10 && mx <= W/2 + 210 && my >= H/2 + 70 && my <= H/2 + 130) {
      AudioEngine.bomb();
      remove(ref(db, 'players/' + targetDeleteName)).catch(e => console.warn(e));
      showDeleteConfirm = false;
    }
    return;
  }

  if (state === 'login') {
    if (my >= H/2 - 100 && my <= H/2 - 30) { activeInput = 'user'; }
    else if (my >= H/2 - 10 && my <= H/2 + 60) { activeInput = 'pass'; }
    else if (mx >= W/2 - 250 && mx <= W/2 + 250 && my >= H/2 + 90 && my <= H/2 + 160) {
      handleLoginAction('login');
    } else if (mx >= W/2 - 250 && mx <= W/2 + 250 && my >= H/2 + 180 && my <= H/2 + 250) {
      handleLoginAction('register');
    }
  }
  else if (state === 'menu') {
    if (isAdmin && mx >= W/2 - 120 && mx <= W/2 + 120 && my >= H - 160 && my <= H - 100) {
      AudioEngine.buy(); state = 'admin'; return;
    }
    if (mx >= W/2 - 160 && mx <= W/2 + 160) {
      if (my >= H/2 - 80 && my <= H/2 + 0) { AudioEngine.buy(); startGame(); }
      else if (my >= H/2 + 20 && my <= H/2 + 100) { AudioEngine.buy(); state = 'shipSelect'; }
      else if (my >= H/2 + 120 && my <= H/2 + 200) { AudioEngine.buy(); state = 'shop'; }
    }
  } 
  else if (state === 'admin') {
    if (mx >= W/2 - 150 && mx <= W/2 + 150 && my >= H - 100 && my <= H - 30) {
      AudioEngine.buy(); state = 'menu'; return;
    }
    const displayList = adminPlayerList.slice(0, 10);
    displayList.forEach((p, i) => {
      const y = 160 + i * 70;
      if (mx >= W - 180 && mx <= W - 80 && my >= y + 10 && my <= y + 50) {
        targetDeleteName = p.playerName;
        showDeleteConfirm = true;
        AudioEngine.error();
      }
    });
  }
  else if (state === 'shipSelect') {
    if (mx >= W/2 - 150 && mx <= W/2 + 150 && my >= H - 100 && my <= H - 30) { AudioEngine.buy(); state = 'menu'; return; }
    SHIPS.forEach((ship, i) => {
      const y = 130 + i * 140;
      const isUnlocked = saveData.unlockedShips.includes(ship.id);
      if (mx >= 60 && mx <= W - 60 && my >= y && my <= y + 115) {
        if (isUnlocked) {
          if (saveData.selectedShipId !== ship.id) { AudioEngine.buy(); saveData.selectedShipId = ship.id; saveToCloud(); }
        } else {
          if (mx >= W - 220 && mx <= W - 80 && my >= y + 30 && my <= y + 85) {
            if (saveData.money >= ship.price) {
              AudioEngine.buy(); saveData.money -= ship.price; saveData.unlockedShips.push(ship.id); saveData.selectedShipId = ship.id; saveToCloud();
            } else { AudioEngine.error(); }
          }
        }
      }
    });
  }
  else if (state === 'shop') {
    if (mx >= W/2 - 150 && mx <= W/2 + 150 && my >= H - 120 && my <= H - 40) { AudioEngine.buy(); state = 'menu'; return; }
    const items = [
      { lvl: saveData.upgradeFire, basePrice: 30, key: 'upgradeFire' },
      { lvl: saveData.upgradeHp, basePrice: 40, key: 'upgradeHp' },
      { lvl: saveData.upgradeSpeed, basePrice: 20, key: 'upgradeSpeed' },
      { lvl: saveData.upgradeSkill, basePrice: 50, key: 'upgradeSkill' }
    ];
    items.forEach((item, i) => {
      const y = 190 + i * 160, bx = W - 300, by = y + 30;
      if (mx >= bx && mx <= bx + 200 && my >= by && my <= by + 80) {
        const currentPrice = getPrice(item.basePrice, item.lvl);
        if (saveData.money >= currentPrice) {
          AudioEngine.buy(); saveData.money -= Math.floor(currentPrice); saveData[item.key]++; saveToCloud();
        } else { AudioEngine.error(); }
      }
    });
  } 
  else if (state === 'gameover') {
    if (mx >= W/2 - 180 && mx <= W/2 + 180 && my >= H/2 + 120 && my <= H/2 + 200) { AudioEngine.buy(); state = 'menu'; }
  }
});

function handleLoginInput(e) {
  if (e.key === 'Tab') {
    e.preventDefault();
    activeInput = activeInput === 'user' ? 'pass' : 'user';
  }
  else if (e.key === 'Enter') {
    handleLoginAction('login');
  }
  else if (e.key === 'Backspace') {
    if (activeInput === 'user') loginUser = loginUser.slice(0, -1);
    else loginPass = loginPass.slice(0, -1);
  }
  else if (e.key.length === 1) {
    if (activeInput === 'user' && loginUser.length < 10) loginUser += e.key;
    else if (activeInput === 'pass' && loginPass.length < 16) loginPass += e.key;
  }
}

addEventListener('keydown', (e) => {
  if (state === 'login') return;
  if (state === 'menu' || state === 'admin') { 
    if (showDeleteConfirm) {
      if (e.key === 'Escape') showDeleteConfirm = false;
      return;
    }
    if (e.key === 'Enter' && state === 'menu') { e.preventDefault(); startGame(); } 
  } 
  else if (state === 'shop' || state === 'shipSelect') { if (e.key === 'Escape' || e.key === 'r' || e.key === 'R') state = 'menu'; } 
  else if (state === 'gameover') { if (e.key === 'r' || e.key === 'R') state = 'menu'; } 
  else if (state === 'playing') {
    if (e.key === 'q' || e.key === 'Q' || e.key === 'j' || e.key === 'J') useBomb();
    if (e.key === 'e' || e.key === 'E' || e.key === 'k' || e.key === 'K') useShield();
  }
});

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
